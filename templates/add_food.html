{% extends "base.html" %}
{% block title %}Add Food Item{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <h2 class="mt-3 mb-4">Add a New Food Item</h2>
    <form method="POST">
      <div class="mb-3">
        <label class="form-label">Name</label>
        <input type="text" name="name" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Description</label>
        <textarea name="description" class="form-control" rows="2"></textarea>
      </div>
      <div class="mb-3">
        <label class="form-label">Price (₹)</label>
        <input type="number" step="0.01" name="price" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Category</label>
        <input type="text" name="category" class="form-control" placeholder="e.g. Pizza, Biryani, Desserts">
      </div>
      <div class="mb-3">
        <label class="form-label">Image URL</label>
        <input type="text" name="image_url" class="form-control" placeholder="https://... (leave blank for a placeholder)">
      </div>
      <button type="submit" class="btn btn-danger w-100">Add Food Item</button>
    </form>
  </div>
</div>
{% endblock %}
