{% extends "base.html" %}
{% block title %}Checkout{% endblock %}
{% block content %}
<h2 class="mt-3 mb-4">Checkout</h2>

<div class="row">
  <div class="col-md-7">
    <form method="POST">
      <div class="mb-3">
        <label class="form-label">Delivery Address</label>
        <textarea name="address" class="form-control" rows="3" required>{{ current_user.address or "" }}</textarea>
      </div>
      <div class="mb-3">
        <label class="form-label">Delivery Instructions (optional)</label>
        <input type="text" name="instructions" class="form-control" placeholder="e.g. ring the bell twice">
      </div>
      <div class="mb-3">
        <label class="form-label">Payment Method</label>
        <select name="payment_method" class="form-select">
          <option value="cash_on_delivery">Cash on Delivery</option>
          <option value="upi">UPI</option>
          <option value="card">Credit / Debit Card</option>
        </select>
      </div>
      <button type="submit" class="btn btn-danger btn-lg w-100">Place Order (₹{{ "%.2f"|format(total) }})</button>
    </form>
  </div>

  <div class="col-md-5">
    <div class="card">
      <div class="card-body">
        <h5 class="card-title">Order Summary</h5>
        <ul class="list-group list-group-flush">
          {% for entry in items %}
          <li class="list-group-item d-flex justify-content-between">
            <span>{{ entry.food.name }} x {{ entry.qty }}</span>
            <span>₹{{ "%.2f"|format(entry.subtotal) }}</span>
          </li>
          {% endfor %}
        </ul>
        <div class="d-flex justify-content-between mt-2 fw-bold">
          <span>Total</span><span>₹{{ "%.2f"|format(total) }}</span>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
